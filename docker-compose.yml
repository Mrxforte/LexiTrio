version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexitrio}
      POSTGRES_USER: ${POSTGRES_USER:-lexitrio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexitrio_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lexitrio_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexitrio_user} -d ${POSTGRES_DB:-lexitrio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - lexitrio_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn -c gunicorn.conf.py config.wsgi:application"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-prod-secret-key-change-in-production}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-lexitrio_user}:${POSTGRES_PASSWORD:-lexitrio_secure_password}@db:5432/${POSTGRES_DB:-lexitrio}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
    volumes:
      - staticfiles_data:/app/staticfiles
    networks:
      - lexitrio_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-prod-secret-key-change-in-production}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-lexitrio_user}:${POSTGRES_PASSWORD:-lexitrio_secure_password}@db:5432/${POSTGRES_DB:-lexitrio}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    networks:
      - lexitrio_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles_data:/app/staticfiles:ro
    networks:
      - lexitrio_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  staticfiles_data:

networks:
  lexitrio_net:
    driver: bridge
