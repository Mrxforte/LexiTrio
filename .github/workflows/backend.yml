name: LexiTrio backend verification
on:
  push:
    branches: [main, codex/lexitrio-namecheap]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python manage.py test tests apps --noinput
        working-directory: backend
